<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majorin Sweets - 魔法じゃない、本物の甘さ</title>
  <meta name="description" content="魔法じゃない、本物の甘さ。痛みと共に生きる人々へ、完璧じゃない支えを。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    
    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes petalFall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(244, 194, 194, 0.3);
      }
      50% {
        box-shadow: 0 0 40px rgba(244, 194, 194, 0.6);
      }
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }
    
    @keyframes magicGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(74, 14, 78, 0.4), 0 0 60px rgba(212, 175, 55, 0.2);
      }
      50% {
        box-shadow: 0 0 50px rgba(74, 14, 78, 0.6), 0 0 100px rgba(212, 175, 55, 0.4);
      }
    }
    
    .petal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #F4C2C2, transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: petalFall 10s linear infinite;
    }
    
    .petal:nth-child(1) { left: 10%; animation-delay: 0s; }
    .petal:nth-child(2) { left: 20%; animation-delay: 2s; }
    .petal:nth-child(3) { left: 30%; animation-delay: 4s; }
    .petal:nth-child(4) { left: 40%; animation-delay: 1s; }
    .petal:nth-child(5) { left: 50%; animation-delay: 3s; }
    .petal:nth-child(6) { left: 60%; animation-delay: 5s; }
    .petal:nth-child(7) { left: 70%; animation-delay: 2.5s; }
    .petal:nth-child(8) { left: 80%; animation-delay: 4.5s; }
    .petal:nth-child(9) { left: 90%; animation-delay: 1.5s; }
    
    @media (max-width: 768px) {
      [data-grid] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MajorinSweetsLP() {
      const [scrollY, setScrollY] = useState(0);
      const [isVisible, setIsVisible] = useState({});
      const sectionRefs = useRef({});

      useEffect(() => {
        const handleScroll = () => {
          setScrollY(window.scrollY);
          
          Object.keys(sectionRefs.current).forEach(key => {
            const element = sectionRefs.current[key];
            if (element) {
              const rect = element.getBoundingClientRect();
              const isInView = rect.top < window.innerHeight * 0.8 && rect.bottom > 0;
              setIsVisible(prev => ({ ...prev, [key]: isInView }));
            }
          });
        };

        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToReservation = () => {
        const ctaSection = document.getElementById('reservation');
        if (ctaSection) {
          ctaSection.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div style={styles.container}>
          {/* Floating Petals */}
          <div style={styles.petalsContainer}>
            {[...Array(9)].map((_, i) => (
              <div key={i} className="petal" />
            ))}
          </div>

          {/* Hero Section with Image */}
          <section style={styles.hero}>
            <div style={styles.heroImageOverlay}>
              <img 
                src="images/image01.JPG" 
                alt="Majorin Sweets" 
                style={styles.heroImage}
              />
              <div style={styles.heroGradientOverlay} />
            </div>
            
            <div style={styles.heroContent}>
              <div style={styles.logoContainer}>
                <h1 style={styles.logo}>MAJORIN SWEETS</h1>
                <div style={styles.ornament}>🌹 ✦ 🌹</div>
              </div>
              <p style={styles.tagline}>
                完璧な人生なんて、ない。<br />
                でも、完璧な一瞬は、ある。
              </p>
              <p style={styles.subTagline}>
                魔法じゃない、本物の甘さ
              </p>
              
              <div style={styles.heroCTAGroup}>
                <button style={styles.heroCTAButton} onClick={scrollToReservation}>
                  予約する
                </button>
                <button style={styles.heroCTAButtonSecondary} onClick={() => {
                  const storySection = document.getElementById('story');
                  if (storySection) storySection.scrollIntoView({ behavior: 'smooth' });
                }}>
                  ストーリーを知る
                </button>
              </div>
            </div>
          </section>

          {/* Workshop Image Section */}
          <section 
            ref={el => sectionRefs.current['workshop'] = el}
            style={{
              ...styles.section,
              ...styles.workshopSection,
              opacity: isVisible['workshop'] ? 1 : 0,
              transform: isVisible['workshop'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.workshopImageContainer}>
                <img 
                  src="images/image02.JPG" 
                  alt="Majorin's Workshop" 
                  style={styles.workshopImage}
                />
                <div style={styles.workshopTextOverlay}>
                  <h2 style={styles.workshopTitle}>マジョリンの工房</h2>
                  <p style={styles.workshopText}>
                    ここで、魔法ではなく心を込めて<br />
                    一つひとつ、お菓子を作っています
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Value Proposition */}
          <section 
            ref={el => sectionRefs.current['value'] = el}
            style={{
              ...styles.section,
              ...styles.valueSection,
              opacity: isVisible['value'] ? 1 : 0,
              transform: isVisible['value'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.ornamentalDivider}>🌸 ━━━ ✦ ━━━ 🌸</div>
              <h2 style={styles.valueMainTitle}>
                痛みを消さない。<br />
                痛みと生きる力をくれる。
              </h2>
              <div style={styles.valueCards} data-grid>
                <div style={styles.miniValueCard}>
                  <div style={styles.miniValueIcon}>🪄</div>
                  <h4 style={styles.miniValueTitle}>魔法は、置いた</h4>
                  <p style={styles.miniValueText}>
                    問題を消すのではなく、<br />向き合う力を
                  </p>
                </div>
                <div style={styles.miniValueCard}>
                  <div style={styles.miniValueIcon}>🍰</div>
                  <h4 style={styles.miniValueTitle}>不完全でいい</h4>
                  <p style={styles.miniValueText}>
                    完璧より、<br />心がこもっている方が強い
                  </p>
                </div>
                <div style={styles.miniValueCard}>
                  <div style={styles.miniValueIcon}>💌</div>
                  <h4 style={styles.miniValueTitle}>真実の一言</h4>
                  <p style={styles.miniValueText}>
                    50種類のカード。<br />あなたに必要な言葉
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Story Section */}
          <section 
            id="story"
            ref={el => sectionRefs.current['story'] = el}
            style={{
              ...styles.section,
              ...styles.lightSection,
              opacity: isVisible['story'] ? 1 : 0,
              transform: isVisible['story'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.ornamentalDivider}>🌸 ━━━ ✦ ━━━ 🌸</div>
              <h2 style={styles.sectionTitle}>STORY</h2>
              <h3 style={styles.subtitle}>なぜ、魔女はお菓子を作るのか</h3>
              
              <div style={styles.storyGrid} data-grid>
                <div style={styles.storyCard}>
                  <div style={styles.cardIcon}>🔮</div>
                  <h4 style={styles.cardTitle}>完璧だった、過去</h4>
                  <p style={styles.cardText}>
                    数百年間、私は「解決の魔女」。<br />
                    病気も、失恋も、貧困も。<br />
                    魔法で、すべてを消してきた。
                  </p>
                </div>
                
                <div style={styles.storyCard}>
                  <div style={styles.cardIcon}>💔</div>
                  <h4 style={styles.cardTitle}>気づいた、真実</h4>
                  <p style={styles.cardText}>
                    痛みを消すことと、人を救うことは違う。<br />
                    痛みこそが、人を育てる。<br />
                    私は、人を弱くしていた。
                  </p>
                </div>
                
                <div style={styles.storyCard}>
                  <div style={styles.cardIcon}>🍰</div>
                  <h4 style={styles.cardTitle}>選んだ、道</h4>
                  <p style={styles.cardText}>
                    だから、杖を置いた。<br />
                    お菓子は痛みを消さない。<br />
                    でも、痛みと生きる力をくれる。
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Majorin Crafting Image */}
          <section 
            ref={el => sectionRefs.current['crafting'] = el}
            style={{
              ...styles.section,
              ...styles.craftingSection,
              opacity: isVisible['crafting'] ? 1 : 0,
              transform: isVisible['crafting'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.craftingImageContainer}>
                <img 
                  src="images/image03.JPG" 
                  alt="Majorin crafting sweets" 
                  style={styles.craftingImage}
                />
                <div style={styles.craftingTextOverlay}>
                  <h3 style={styles.craftingTitle}>
                    「魔法で作ったものは、魔法で壊れる。<br />
                    でも、手で作ったものは、心に残る」
                  </h3>
                </div>
              </div>
            </div>
          </section>

          {/* The Moment */}
          <section 
            ref={el => sectionRefs.current['turning'] = el}
            style={{
              ...styles.section,
              ...styles.roseSection,
              opacity: isVisible['turning'] ? 1 : 0,
              transform: isVisible['turning'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out 0.2s'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.ornamentalDivider}>🌸 ━━━ ✦ ━━━ 🌸</div>
              <h2 style={styles.sectionTitle}>THE MOMENT</h2>
              <h3 style={styles.subtitle}>すべてが変わった、ある雨の日</h3>
              
              <div style={styles.turningContent}>
                <div style={styles.epiphanyBox}>
                  <p style={styles.epiphanyQuote}>
                    「これ、亡くなった母が作ってくれたケーキと<br />
                    同じ味なんです。<br />
                    不器用で、形は歪だったけど...温かくて」
                  </p>
                  <p style={styles.epiphanyAuthor}>― エレナ、街のカフェにて</p>
                </div>
                
                <div style={styles.epiphany}>
                  <p style={styles.epiphanyText}>
                    その瞬間、私は理解した。
                  </p>
                  <p style={styles.epiphanyHighlight}>
                    お菓子は、痛みを消さない。<br />
                    でも、痛みと一緒に生きる力をくれる。
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* ========== DARK TRANSITION STARTS HERE ========== */}

          {/* Philosophy - DARK VERSION */}
          <section 
            ref={el => sectionRefs.current['philosophy'] = el}
            style={{
              ...styles.section,
              ...styles.darkSection,
              opacity: isVisible['philosophy'] ? 1 : 0,
              transform: isVisible['philosophy'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out 0.3s'
            }}
          >
            {/* Magic particles background */}
            <div style={styles.magicBackground}>
              <div style={styles.magicParticle1} />
              <div style={styles.magicParticle2} />
              <div style={styles.magicParticle3} />
            </div>
            
            <div style={styles.sectionContent}>
              <div style={styles.darkOrnamentalDivider}>━━━━━ ✦ ━━━━━</div>
              <h2 style={styles.darkPhilosophyTitle}>完璧じゃなくても、本物であれ</h2>
              
              <div style={styles.darkPhilosophyGrid} data-grid>
                <div style={styles.darkPhilosophyCard}>
                  <p style={styles.darkPhilosophyQuote}>
                    痛みを消すな。<br />痛みと生きろ。
                  </p>
                </div>
                <div style={styles.darkPhilosophyCard}>
                  <p style={styles.darkPhilosophyQuote}>
                    魔法で作ったものは、<br />魔法で壊れる。
                  </p>
                </div>
                <div style={styles.darkPhilosophyCard}>
                  <p style={styles.darkPhilosophyQuote}>
                    手で作ったものは、<br />心に残る。
                  </p>
                </div>
                <div style={styles.darkPhilosophyCard}>
                  <p style={styles.darkPhilosophyQuote}>
                    完璧より、<br />本物。
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Products - DARK VERSION */}
          <section 
            ref={el => sectionRefs.current['products'] = el}
            style={{
              ...styles.section,
              ...styles.purpleSection,
              opacity: isVisible['products'] ? 1 : 0,
              transform: isVisible['products'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.darkOrnamentalDivider}>━━━━━ ✦ ━━━━━</div>
              <h2 style={styles.darkSectionTitle}>EXPERIENCE</h2>
              <h3 style={styles.darkSubtitle}>あなたが受け取るもの</h3>
              
              <div style={styles.darkProductExperience}>
                <div style={styles.darkExperienceItem}>
                  <div style={styles.darkExperienceNumber}>01</div>
                  <h4 style={styles.darkExperienceItemTitle}>不完全な美味しさ</h4>
                  <p style={styles.darkExperienceItemText}>
                    チョコは飛び散るし、生地は崩れる。<br />
                    でも、魔法は使わない。<br />
                    不器用で、失敗だらけ。それが、愛おしい。
                  </p>
                  <div style={styles.darkExperienceDetail}>
                    🌹 手作りケーキ1個 + オリジナルボックス
                  </div>
                </div>

                <div style={styles.darkExperienceItem}>
                  <div style={styles.darkExperienceNumber}>02</div>
                  <h4 style={styles.darkExperienceItemTitle}>真実のカード</h4>
                  <p style={styles.darkExperienceItemText}>
                    全50種類からランダムで1枚。<br />
                    一言で、核心を突く。<br />
                    「で?」「それだけよ」「逃げるな」
                  </p>
                  <div style={styles.darkExperienceDetail}>
                    💌 マジョリンからの手書きメッセージカード
                  </div>
                </div>

                <div style={styles.darkExperienceItem}>
                  <div style={styles.darkExperienceNumber}>03</div>
                  <h4 style={styles.darkExperienceItemTitle}>向き合う時間</h4>
                  <p style={styles.darkExperienceItemText}>
                    お菓子を食べる15分間。<br />
                    それは、自分と向き合う時間。<br />
                    完璧じゃない自分を、受け入れる時間。
                  </p>
                  <div style={styles.darkExperienceDetail}>
                    ✨ あなただけの、完璧な一瞬
                  </div>
                </div>
              </div>

              <div style={styles.darkLimitationBox}>
                <p style={styles.darkLimitationTitle}>🌹 完全予約制 | 月100個限定 🌹</p>
                <p style={styles.darkLimitationText}>
                  私のお菓子は、逃げたい人には向いてない。<br />
                  向き合いたい人のための、本物の支え。
                </p>
              </div>
            </div>
          </section>

          {/* Testimonials - DARK VERSION */}
          <section 
            ref={el => sectionRefs.current['testimonial'] = el}
            style={{
              ...styles.section,
              ...styles.darkSection,
              opacity: isVisible['testimonial'] ? 1 : 0,
              transform: isVisible['testimonial'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.darkOrnamentalDivider}>━━━━━ ✦ ━━━━━</div>
              <h2 style={styles.darkSectionTitle}>VOICES</h2>
              <h3 style={styles.darkSubtitle}>向き合った人たちの声</h3>
              
              <div style={styles.darkTestimonialGrid} data-grid>
                <div style={styles.darkTestimonialCard}>
                  <p style={styles.darkTestimonialText}>
                    「カードには『で?』の一言だけ。<br />
                    涙が止まらなかった。<br />
                    逃げてた自分に、気づいてしまった」
                  </p>
                  <p style={styles.darkTestimonialAuthor}>― 30代女性、会社員</p>
                </div>
                
                <div style={styles.darkTestimonialCard}>
                  <p style={styles.darkTestimonialText}>
                    「ケーキは崩れてたけど、<br />
                    それが逆に良かった。<br />
                    完璧じゃなくていいんだって」
                  </p>
                  <p style={styles.darkTestimonialAuthor}>― 40代男性、経営者</p>
                </div>
                
                <div style={styles.darkTestimonialCard}>
                  <p style={styles.darkTestimonialText}>
                    「『それだけよ』というカード。<br />
                    シンプルだけど、深い。<br />
                    考えすぎてた自分に刺さった」
                  </p>
                  <p style={styles.darkTestimonialAuthor}>― 20代女性、学生</p>
                </div>
              </div>
            </div>
          </section>

          {/* FAQ - DARK VERSION */}
          <section 
            ref={el => sectionRefs.current['faq'] = el}
            style={{
              ...styles.section,
              ...styles.purpleSection,
              opacity: isVisible['faq'] ? 1 : 0,
              transform: isVisible['faq'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.darkOrnamentalDivider}>━━━━━ ✦ ━━━━━</div>
              <h2 style={styles.darkSectionTitle}>FAQ</h2>
              <h3 style={styles.darkSubtitle}>よくある質問</h3>
              
              <div style={styles.darkFaqList}>
                <div style={styles.darkFaqItem}>
                  <h4 style={styles.darkFaqQuestion}>Q. 本当に魔法は使わないんですか?</h4>
                  <p style={styles.darkFaqAnswer}>
                    A. 使いません。料理だけは、魔法で美味しくできない。心を込めることは、魔法ではできません。
                  </p>
                </div>
                
                <div style={styles.darkFaqItem}>
                  <h4 style={styles.darkFaqQuestion}>Q. カードはどうやって選ばれるんですか?</h4>
                  <p style={styles.darkFaqAnswer}>
                    A. ランダムです。でも不思議と、その人に必要な言葉が届く。それが、唯一残った魔法かもしれません。
                  </p>
                </div>
                
                <div style={styles.darkFaqItem}>
                  <h4 style={styles.darkFaqQuestion}>Q. 賞味期限は?</h4>
                  <p style={styles.darkFaqAnswer}>
                    A. 到着から3日間。保存料も使いません。だから、「今」食べてほしい。
                  </p>
                </div>
                
                <div style={styles.darkFaqItem}>
                  <h4 style={styles.darkFaqQuestion}>Q. ギフトとして送れますか?</h4>
                  <p style={styles.darkFaqAnswer}>
                    A. 送れます。でも、カードは送り主ではなく、受け取る人へのメッセージになります。
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Manifesto - DARK VERSION */}
          <section 
            ref={el => sectionRefs.current['manifesto'] = el}
            style={{
              ...styles.section,
              ...styles.darkSection,
              opacity: isVisible['manifesto'] ? 1 : 0,
              transform: isVisible['manifesto'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out 0.2s'
            }}
          >
            {/* Magic particles background */}
            <div style={styles.magicBackground}>
              <div style={styles.magicParticle1} />
              <div style={styles.magicParticle2} />
            </div>
            
            <div style={styles.sectionContent}>
              <div style={styles.darkOrnamentalDivider}>━━━━━ ✦ ━━━━━</div>
              <h2 style={styles.darkManifestoTitle}>最後に</h2>
              
              <div style={styles.darkManifestoContent}>
                <p style={styles.darkManifestoText}>
                  私はマジョリン。<br />
                  かつて、完璧な魔女だった。
                </p>
                <p style={styles.darkManifestoText}>
                  でも気づいた。<br />
                  痛みを消すことと、人を救うことは、違う。
                </p>
                <p style={styles.darkManifestoHighlight}>
                  私のお菓子は、痛みを消さない。<br />
                  でも、痛みと一緒に生きる力をくれる。
                </p>
                <p style={styles.darkManifestoText}>
                  完璧な人生なんて、ない。<br />
                  でも、完璧な一瞬は、ある。
                </p>
                <p style={styles.darkManifestoText}>
                  あなたに必要なのは、魔法じゃない。<br />
                  本物の甘さ。
