<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majorin Sweets - 魔法の扉を開けて</title>
  <meta name="description" content="魔法じゃない、本物の甘さ。扉を開けて、マジョリンの世界へ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #0a0a0a;
    }
    
    /* ========== ANIMATIONS ========== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes petalFall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    @keyframes butlerAppear {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes choicesFadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes doorGlow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(222, 134, 163, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(222, 134, 163, 0.85));
      }
    }
    
    @keyframes productFadeIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      }
      50% {
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.6);
      }
    }
    
    .petal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #DE86A3, transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: petalFall 10s linear infinite;
    }
    
    .petal:nth-child(1) { left: 10%; animation-delay: 0s; }
    .petal:nth-child(2) { left: 20%; animation-delay: 2s; }
    .petal:nth-child(3) { left: 30%; animation-delay: 4s; }
    .petal:nth-child(4) { left: 40%; animation-delay: 1s; }
    .petal:nth-child(5) { left: 50%; animation-delay: 3s; }
    .petal:nth-child(6) { left: 60%; animation-delay: 5s; }
    .petal:nth-child(7) { left: 70%; animation-delay: 2.5s; }
    .petal:nth-child(8) { left: 80%; animation-delay: 4.5s; }
    .petal:nth-child(9) { left: 90%; animation-delay: 1.5s; }
    
    @media (max-width: 768px) {
      [data-grid] {
        grid-template-columns: 1fr !important;
      }
      
      .butler-image {
        height: 50vh !important;
        max-height: 400px !important;
      }
      
      .welcome-title {
        font-size: 1.8rem !important;
      }
      
      .choice-button {
        padding: 20px 35px !important;
        font-size: 1rem !important;
      }
    }

    /* MOVIE: 769px 以上は 16:9。768px 以下はインラインの縦長（9:16）のまま */
    @media (min-width: 769px) {
      .movie-video-frame {
        width: min(100%, 920px) !important;
        aspect-ratio: 16 / 9 !important;
        max-height: none !important;
      }
    }

    /* ===== STORY ALTERNATING ROWS ===== */
    .story-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 64px;
      margin-bottom: 88px;
    }
    .story-row.reverse {
      flex-direction: row-reverse;
    }
    .story-row-img {
      width: 46%;
      flex-shrink: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 44px rgba(0,0,0,0.18);
    }
    .story-row-img img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }
    .story-row-text {
      flex: 1;
    }

    /* ===== WITCH MASCOT ===== */
    @keyframes witchFloat {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50%       { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes witchBurst {
      0%   { transform: scale(1)   rotate(0deg);   opacity: 1; }
      20%  { transform: scale(1.3) rotate(30deg);  opacity: 0.9; }
      100% { transform: scale(0)   rotate(720deg); opacity: 0; }
    }

    /* ===== CHOICE BUTTONS: 右から左へスライドイン ===== */
    @keyframes slideInFromRight {
      from { opacity: 0; transform: translateX(140px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .choice-btn-0 { animation: slideInFromRight 0.55s ease-out 0.10s both; }
    .choice-btn-1 { animation: slideInFromRight 0.55s ease-out 0.35s both; }
    .choice-btn-2 { animation: slideInFromRight 0.55s ease-out 0.60s both; }
    .choice-btn-3 { animation: slideInFromRight 0.55s ease-out 0.85s both; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .story-row,
      .story-row.reverse {
        flex-direction: column !important;
        gap: 24px;
        margin-bottom: 56px;
      }
      .story-row-img {
        width: 100%;
      }
      .story-row-img img {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ===== パーティクル1粒 ===== */
    function ParticleDot({ angle, distance, size, emoji }) {
      const [gone, setGone] = React.useState(false);
      React.useEffect(() => {
        const id = requestAnimationFrame(() => setGone(true));
        return () => cancelAnimationFrame(id);
      }, []);
      const rad = (angle * Math.PI) / 180;
      const tx = Math.cos(rad) * distance;
      const ty = Math.sin(rad) * distance;
      return (
        <div style={{
          position: 'absolute',
          top: '50%', left: '50%',
          fontSize: size + 'px',
          lineHeight: 1,
          marginLeft: '-0.5em', marginTop: '-0.5em',
          pointerEvents: 'none',
          transform: gone
            ? `translate(${tx}px, ${ty}px) scale(0)`
            : 'translate(0,0) scale(1)',
          opacity: gone ? 0 : 1,
          transition: 'transform 0.75s cubic-bezier(0.15,0.85,0.25,1), opacity 0.75s ease-out',
          zIndex: 30,
        }}>{emoji}</div>
      );
    }

    /* ===== 魔女マスコット ===== */
    function WitchMascot({ src, side, topPx }) {
      const [phase, setPhase] = React.useState('idle'); // idle | exploding | hidden
      const [particles, setParticles] = React.useState([]);
      const reviveRef = React.useRef(null);
      const EMOJIS = ['🌸', '🌺', '✦', '✿', '★', '🌟', '✧', '❀'];
      const REVIVE_MS = 30000;

      const handleClick = () => {
        if (phase !== 'idle') return;
        const pts = Array.from({ length: 20 }, (_, i) => ({
          id: i,
          angle: (i / 20) * 360 + (Math.random() * 18 - 9),
          distance: 55 + Math.random() * 95,
          size: 12 + Math.floor(Math.random() * 13),
          emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
        }));
        setParticles(pts);
        setPhase('exploding');
        setTimeout(() => {
          setPhase('hidden');
          setParticles([]);
          reviveRef.current = setTimeout(() => setPhase('idle'), REVIVE_MS);
        }, 750);
      };

      React.useEffect(() => () => clearTimeout(reviveRef.current), []);

      if (phase === 'hidden') return null;

      return (
        <div
          title="クリックしてみて"
          style={{
            position: 'absolute',
            [side]: '16px',
            top: topPx + 'px',
            zIndex: 5,
            cursor: phase === 'idle' ? 'pointer' : 'default',
          }}
        >
          <div style={{ position: 'relative', display: 'inline-block' }}>
            <img
              src={src}
              alt="Majorin"
              draggable={false}
              onClick={handleClick}
              style={{
                width: '140px',
                display: 'block',
                userSelect: 'none',
                animation: phase === 'idle'
                  ? 'witchFloat 3.2s ease-in-out infinite'
                  : 'witchBurst 0.75s ease-in forwards',
                filter: 'drop-shadow(0 6px 18px rgba(0,0,0,0.22))',
              }}
            />
            {particles.map(p => <ParticleDot key={p.id} {...p} />)}
          </div>
        </div>
      );
    }

    function MajorinSweetsLP() {
      const [scrollY, setScrollY] = useState(0);
      const [isVisible, setIsVisible] = useState({});
      const [doorState, setDoorState] = useState('closed'); 
      const [showButler, setShowButler] = useState(false);
      const [showChoices, setShowChoices] = useState(false);
      
      const sectionRefs = useRef({});
      const doorSectionRef = useRef(null);

      useEffect(() => {
        const handleScroll = () => {
          setScrollY(window.scrollY);
          
          Object.keys(sectionRefs.current).forEach(key => {
            const element = sectionRefs.current[key];
            if (element) {
              const rect = element.getBoundingClientRect();
              const isInView = rect.top < window.innerHeight * 0.8 && rect.bottom > 0;
              setIsVisible(prev => ({ ...prev, [key]: isInView }));
            }
          });
          
          if (doorSectionRef.current && doorState === 'closed') {
            const rect = doorSectionRef.current.getBoundingClientRect();
            if (rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2) {
              setDoorState('opening');
              
              setTimeout(() => {
                setDoorState('open');
                setShowButler(true);
                
                setTimeout(() => {
                  setShowChoices(true);
                }, 1000);
              }, 2000);
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [doorState]);

      const handleChoice = (choice) => {
        if (choice === 'buy') {
          setDoorState('shopping');
          setTimeout(() => {
            const el = document.getElementById('products');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 500);
        } else if (choice === 'story') {
          // ストーリーは常時表示 — そのままスクロール
          const el = document.getElementById('story');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const scrollToReservation = () => {
        const ctaSection = document.getElementById('reservation');
        if (ctaSection) {
          ctaSection.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div style={styles.container}>
          <div style={styles.petalsContainer}>
            {[...Array(9)].map((_, i) => (
              <div key={i} className="petal" />
            ))}
          </div>

          {/* Hero Section */}
          <section style={styles.hero}>
            <div style={styles.heroImageOverlay}>
              <img 
                src="images/image01.JPG" 
                alt="Majorin Sweets" 
                style={styles.heroImage}
              />
              <div style={styles.heroGradientOverlay} />
            </div>
            
            <div style={styles.heroContent}>
              <div style={styles.logoContainer}>
                <h1 style={styles.logo}>MAJORIN SWEETS</h1>
                <div style={styles.ornament}>🌹 ✦ 🌹</div>
              </div>
              <p style={styles.tagline}>
                完璧な人生なんて、ない。<br />
                でも、完璧な一瞬は、ある。
              </p>
              <p style={styles.subTagline}>
                魔法の扉を開けて、マジョリンの世界へ
              </p>
              
              <div style={styles.scrollHint}>
                <p style={styles.scrollHintText}>↓ スクロールして扉を開ける ↓</p>
              </div>
            </div>
          </section>

          {/*
            ========== 扉演出の画像設定（差し替え時はここを参照）==========
            images/background.jpg … 扉の奥の外観（全面背景・ぼかし＋薄く重ねる）
            images/door-left.png  … 左扉（透過PNG）。左端を軸に rotateY で開く
            images/door-right.png … 右扉（透過PNG）。右端を軸に開く
            images/doorman.png    … 扉が開いた後に表示する執事（奥レイヤー）
            ヒーロー画像: images/image01.JPG（別セクション）
          */}
          {/* ========== DOOR SECTION ========== */}
          <section 
            ref={doorSectionRef}
            style={styles.doorSection}
          >
            <div style={styles.doorBackground}>
              {/* 背景画像（店舗外観） */}
              <img 
                src="images/background.jpg" 
                alt="Majorins Shop" 
                style={styles.doorBackgroundImage}
              />
              
              {/* 左扉（透過PNG） */}
              <div 
                style={{
                  ...styles.door,
                  ...styles.doorLeft,
                  transform: doorState === 'opening' || doorState === 'open' || doorState === 'shopping' || doorState === 'story'
                    ? 'perspective(1200px) rotateY(-105deg)'
                    : 'rotateY(0deg)',
                }}
              >
                <img 
                  src="images/door-left.png" 
                  alt="Left Door" 
                  style={styles.doorImage}
                />
              </div>
              
              {/* 右扉（透過PNG） */}
              <div 
                style={{
                  ...styles.door,
                  ...styles.doorRight,
                  transform: doorState === 'opening' || doorState === 'open' || doorState === 'shopping' || doorState === 'story'
                    ? 'perspective(1200px) rotateY(105deg)'
                    : 'rotateY(0deg)',
                }}
              >
                <img 
                  src="images/door-right.png" 
                  alt="Right Door" 
                  style={styles.doorImage}
                />
              </div>
              
              {/* 扉の奥の世界 */}
              {(doorState === 'open' || doorState === 'shopping' || doorState === 'story') && (
                <>
                  {/* 執事の登場 */}
                  {showButler && (
                    <div style={styles.butlerContainer}>
                      <img 
                        src="images/doorman.png" 
                        alt="Butler" 
                        style={styles.butlerImage}
                        className="butler-image"
                      />
                    </div>
                  )}
                  
                  <div style={styles.behindDoor}>
                    {showButler && (
                      <div style={styles.welcomeBox}>
                        <h2 style={styles.welcomeTitle} className="welcome-title">ようこそ、マジョリンの世界へ</h2>
                        <p style={styles.welcomeText}>
                          執事がお迎えいたします。<br />
                          どちらをお選びになりますか？
                        </p>
                      </div>
                    )}
                  
                  {showChoices && doorState === 'open' && (
                    <div style={styles.choicesContainer}>
                      {[
                        { key: 'buy',   icon: '🛍️', label: 'スイーツを買う',   primary: true,  disabled: false },
                        { key: 'story', icon: '📖', label: 'ストーリーをみる', primary: false, disabled: false },
                        { key: 'tbd1',  icon: '🌹', label: '準備中',           primary: false, disabled: true  },
                        { key: 'tbd2',  icon: '✦',  label: '準備中',           primary: false, disabled: true  },
                      ].map((item, i) => (
                        <button
                          key={item.key}
                          className={`choice-button choice-btn-${i}`}
                          style={{
                            ...(item.primary ? styles.choiceButton : styles.choiceButtonSecondary),
                            ...(item.disabled ? { opacity: 0.4, cursor: 'default' } : {}),
                          }}
                          onClick={() => { if (!item.disabled) handleChoice(item.key); }}
                          onMouseEnter={(e) => {
                            if (item.disabled) return;
                            e.currentTarget.style.transform = 'scale(1.05)';
                            if (!item.primary) e.currentTarget.style.background = 'rgba(212, 175, 55, 0.2)';
                          }}
                          onMouseLeave={(e) => {
                            if (item.disabled) return;
                            e.currentTarget.style.transform = 'scale(1)';
                            if (!item.primary) e.currentTarget.style.background = 'transparent';
                          }}
                        >
                          <span style={styles.choiceIcon}>{item.icon}</span>
                          <span style={styles.choiceText}>{item.label}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                </>
              )}
              
              {/* 閉じた扉の装飾 */}
              {doorState === 'closed' && (
                <div style={styles.doorDecoration}>
                  <div style={styles.doorHintBox}>
                    <p style={styles.doorHint}>扉の奥に、マジョリンの世界が待っています</p>
                    <p style={styles.doorHintArrow}>↓</p>
                    <p style={styles.doorHintAction}>スクロールして扉を開く</p>
                  </div>
                </div>
              )}
            </div>
          </section>

          {/* Movie — 自動再生せず、ユーザーが再生ボタンで視聴（769px以上は .movie-video-frame で16:9） */}
          <section style={styles.movieSection} aria-label="ブランドムービー">
            <div style={styles.movieSectionInner}>
              <div style={styles.movieOrnament}>🌹 ━━━ ✦ ━━━ 🌹</div>
              <h2 style={styles.movieTitle}>MOVIE</h2>
              <p style={styles.movieLead}>
                下の再生ボタンからご覧ください（自動では再生されません）
              </p>
              <div className="movie-video-frame" style={styles.movieVideoWrap}>
                <video
                  style={styles.movieVideo}
                  controls
                  playsInline
                  preload="metadata"
                  poster="images/image01.JPG"
                >
                  <source src="videos/0429.mov" type="video/quicktime" />
                </video>
              </div>
            </div>
          </section>

          {/* ========== PRODUCT SELECTION ========== */}
          {doorState === 'shopping' && (
            <section id="products" style={styles.productSection}>
              <div style={styles.productSectionContent}>
                <div style={styles.ornamentalDivider}>🌸 ━━━ ✦ ━━━ 🌸</div>
                <h2 style={styles.productTitle}>お好きなスイーツをお選びください</h2>
                <p style={styles.productSubtitle}>すべて手作り、心を込めて</p>
                
                <div style={styles.productGrid}>
                  <div style={{...styles.productCard, animationDelay: '0s'}}>
                    <div style={styles.productImageContainer}>
                      <img 
                        src="images/image03.JPG" 
                        alt="定番セット" 
                        style={styles.productImage}
                      />
                    </div>
                    <div style={styles.productInfo}>
                      <h3 style={styles.productName}>定番セット</h3>
                      <p style={styles.productDescription}>
                        手作りケーキ1個 + 真実のカード<br />
                        マジョリンからのメッセージ付き
                      </p>
                      <p style={styles.productPrice}>¥3,800</p>
                      <button 
                        style={styles.productButton} 
                        onClick={scrollToReservation}
                        onMouseEnter={(e) => e.target.style.transform = 'translateY(-3px)'}
                        onMouseLeave={(e) => e.target.style.transform = 'translateY(0)'}
                      >
                        予約する
                      </button>
                    </div>
                  </div>
                  
                  <div style={{...styles.productCard, animationDelay: '0.2s'}}>
                    <div style={styles.productImageContainer}>
                      <img 
                        src="images/image02.JPG" 
                        alt="プレミアムセット" 
                        style={styles.productImage}
                      />
                    </div>
                    <div style={styles.productInfo}>
                      <h3 style={styles.productName}>プレミアムセット</h3>
                      <p style={styles.productDescription}>
                        手作りケーキ2個 + 真実のカード2枚<br />
                        特別なオリジナルボックス
                      </p>
                      <p style={styles.productPrice}>¥7,200</p>
                      <button 
                        style={styles.productButton} 
                        onClick={scrollToReservation}
                        onMouseEnter={(e) => e.target.style.transform = 'translateY(-3px)'}
                        onMouseLeave={(e) => e.target.style.transform = 'translateY(0)'}
                      >
                        予約する
                      </button>
                    </div>
                  </div>
                  
                  <div style={{...styles.productCard, animationDelay: '0.4s'}}>
                    <div style={styles.productImageContainer}>
                      <img 
                        src="images/image01.JPG" 
                        alt="ギフトセット" 
                        style={styles.productImage}
                      />
                    </div>
                    <div style={styles.productInfo}>
                      <h3 style={styles.productName}>ギフトセット</h3>
                      <p style={styles.productDescription}>
                        大切な人への贈り物<br />
                        ギフトラッピング + メッセージ代筆
                      </p>
                      <p style={styles.productPrice}>¥4,500</p>
                      <button 
                        style={styles.productButton} 
                        onClick={scrollToReservation}
                        onMouseEnter={(e) => e.target.style.transform = 'translateY(-3px)'}
                        onMouseLeave={(e) => e.target.style.transform = 'translateY(0)'}
                      >
                        予約する
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* ========== STORY SECTION — 常時表示 ========== */}
          {/* Workshop Image Section */}
          <section 
            id="story"
            ref={el => sectionRefs.current['workshop'] = el}
            style={{
              ...styles.section,
              ...styles.workshopSection,
              opacity: isVisible['workshop'] ? 1 : 0,
              transform: isVisible['workshop'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
          >
            <div style={styles.sectionContent}>
              <div style={styles.workshopImageContainer}>
                <img 
                  src="images/image02.JPG" 
                  alt="Majorin's Workshop" 
                  style={styles.workshopImage}
                />
                <div style={styles.workshopTextOverlay}>
                  <h2 style={styles.workshopTitle}>マジョリンの工房</h2>
                  <p style={styles.workshopText}>
                    ここで、魔法ではなく心を込めて<br />
                    一つひとつ、お菓子を作っています
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* Value Proposition */}
          <section 
            ref={el => sectionRefs.current['value'] = el}
            style={{
              ...styles.section,
              ...styles.valueSection,
              opacity: isVisible['value'] ? 1 : 0,
              transform: isVisible['value'] ? 'translateY(0)' : 'translateY(50px)',
              transition: 'all 1s ease-out'
            }}
