<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majorin Sweets - 魔法の扉を開けて</title>
  <meta name="description" content="魔法じゃない、本物の甘さ。扉を開けて、マジョリンの世界へ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #0a0a0a;
    }
    
    /* ========== ANIMATIONS ========== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes petalFall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    @keyframes butlerAppear {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes choicesFadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes doorGlow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(222, 134, 163, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(222, 134, 163, 0.85));
      }
    }
    
    @keyframes productFadeIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(192, 64, 96, 0.25);
      }
      50% {
        box-shadow: 0 0 60px rgba(192, 64, 96, 0.45);
      }
    }

    /* ===== OPENING（ページ読み込み時・5.6秒） ===== */
    .opening-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .hero-caption-body {
      color: #FFFFFF;
      -webkit-text-stroke: 1px #000000;
      paint-order: stroke fill;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ===== LETTER POPUP (占い) ===== */
    @keyframes letterPopIn {
      from { opacity: 0; transform: translateY(20px) scale(0.88); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* 画面中央に固定（Portal で body 直下に描画） */
    .letter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(10, 10, 10, 0.6);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .letter-card {
      animation: letterPopIn 0.45s ease-out both;
      max-width: 420px;
      width: 100%;
      background: linear-gradient(165deg, #faf6f0 0%, #f0e8dc 100%);
      border: 2px solid rgba(26, 26, 26, 0.15);
      border-radius: 4px;
      padding: 40px 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      position: relative;
      font-family: 'Cormorant Garamond', serif;
    }
    .letter-card::before {
      content: '';
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px solid rgba(192, 64, 96, 0.25);
      pointer-events: none;
    }
    .story-chapter-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #1A1A1A;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .story-chapter-divider {
      text-align: center;
      color: #C04060;
      letter-spacing: 0.4em;
      margin: 48px 0 40px;
      font-size: 0.85rem;
    }
    
    .petal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #DE86A3, transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: petalFall 10s linear infinite;
    }
    
    .petal:nth-child(1) { left: 10%; animation-delay: 0s; }
    .petal:nth-child(2) { left: 20%; animation-delay: 2s; }
    .petal:nth-child(3) { left: 30%; animation-delay: 4s; }
    .petal:nth-child(4) { left: 40%; animation-delay: 1s; }
    .petal:nth-child(5) { left: 50%; animation-delay: 3s; }
    .petal:nth-child(6) { left: 60%; animation-delay: 5s; }
    .petal:nth-child(7) { left: 70%; animation-delay: 2.5s; }
    .petal:nth-child(8) { left: 80%; animation-delay: 4.5s; }
    .petal:nth-child(9) { left: 90%; animation-delay: 1.5s; }
    
    @media (max-width: 768px) {
      [data-grid] {
        grid-template-columns: 1fr !important;
      }
      
      .butler-image {
        height: 50vh !important;
        max-height: 400px !important;
      }
      
      .welcome-title {
        font-size: 1.8rem !important;
      }
      
      .choice-button {
        padding: 20px 35px !important;
        font-size: 1rem !important;
      }
    }

    /* MOVIE: 769px 以上は 16:9。768px 以下はインラインの縦長（9:16）のまま */
    @media (min-width: 769px) {
      .movie-video-frame {
        width: min(100%, 920px) !important;
        aspect-ratio: 16 / 9 !important;
        max-height: none !important;
      }
    }

    /* ===== STORY ALTERNATING ROWS ===== */
    .story-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 64px;
      margin-bottom: 88px;
    }
    .story-row.reverse {
      flex-direction: row-reverse;
    }
    .story-row-img {
      width: 46%;
      flex-shrink: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 44px rgba(0,0,0,0.18);
    }
    .story-row-img img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }
    .story-row-text {
      flex: 1;
    }

    /* ===== WITCH MASCOT ===== */
    @keyframes witchFloat {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50%       { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes witchBurst {
      0%   { transform: scale(1)   rotate(0deg);   opacity: 1; }
      20%  { transform: scale(1.3) rotate(30deg);  opacity: 0.9; }
      100% { transform: scale(0)   rotate(720deg); opacity: 0; }
    }

    /* ===== CHOICE BUTTONS: 右から左へスライドイン ===== */
    @keyframes slideInFromRight {
      from { opacity: 0; transform: translateX(140px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .choice-btn-0 { animation: slideInFromRight 0.55s ease-out 0.10s both; }
    .choice-btn-1 { animation: slideInFromRight 0.55s ease-out 0.35s both; }
    .choice-btn-2 { animation: slideInFromRight 0.55s ease-out 0.60s both; }
    .choice-btn-3 { animation: slideInFromRight 0.55s ease-out 0.85s both; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .story-row,
      .story-row.reverse {
        flex-direction: column !important;
        gap: 24px;
        margin-bottom: 56px;
      }
      .story-row-img {
        width: 100%;
      }
      .story-row-img img {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // TODO: T1 — ロゴ基準ピンク確定後に置換
    const PINK_LOGO_COLOR = '#C04060';

    const HERO_IMAGE = 'images/spring2026/hero_main.jpg';
    const OPENING_VIDEO = 'videos/opening.mp4';

    // マジョリンからの手紙（50件）
    const MARJORIN_MESSAGES = [
      { id: 1, tone: 'mixed', body: '完璧な人生などない。でも、その一瞬を輝かせることは、あなたにもできる。' },
      { id: 2, tone: 'mixed', body: '痛みを消すのではなく、痛みと共に歩む力を、そっと渡したい。' },
      { id: 3, tone: 'mixed', body: '夢は遠くにあるのではない。今日の一口の甘さの中にある。' },
      { id: 4, tone: 'mixed', body: '勝者でなくていい。心があるものの方が、ずっと強い。' },
      { id: 5, tone: 'mixed', body: '手で作ったものだけが、心に残る。魔法ではなく、あなたの時間を。' },
      { id: 6, tone: 'mixed', body: '不器用な形のケーキほど、温かいことがある。' },
      { id: 7, tone: 'mixed', body: '真実の一言は、50枚のカードの中に、一枚だけある。' },
      { id: 8, tone: 'mixed', body: 'お菓子は、あなたを癒す魔法。杖は、もう置いた。' },
      { id: 9, tone: 'mixed', body: 'MAJORINS の扉を開けたあなたへ——ようこそ、甘さの世界へ。' },
      { id: 10, tone: 'mixed', body: '輝くパッションを、心に響くスイーツで届けたい。' },

      { id: 12, tone: 'devil', body: '迷っている時点で、答えはもう出ている。それを認める勇気だけが、足りないの。' },
      { id: 13, tone: 'devil', body: '「できない」は、たいてい「やりたくない」の上品な言い換え。' },
      { id: 14, tone: 'devil', body: '完璧を装うのは、もう、おやめなさい。' },
      { id: 15, tone: 'devil', body: '期待された通りに生きて、それで満足? ——本当に?' },
      { id: 16, tone: 'devil', body: '「忙しい」という言葉に、私はもう騙されない。あなたも、騙されないで。' },
      { id: 17, tone: 'devil', body: '強がりは美しくない。素直さの方が、ずっと品がある。' },
      { id: 18, tone: 'devil', body: '諦める理由を、他人に求めないで。' },
      { id: 19, tone: 'devil', body: '自分に嘘をついた数だけ、夜が長くなる。' },
      { id: 20, tone: 'devil', body: 'あなたのベストは、本当にそれ?' },
      { id: 21, tone: 'devil', body: '痛みを抱えたまま、歩いていい。消さなくていい。' },
      { id: 22, tone: 'philosopher', body: '完璧な選択など、どこにもない。選んだ道を、完璧にしていくだけ。' },
      { id: 23, tone: 'philosopher', body: '強さとは、弱さを許すこと。50年生きて、やっとわかった。' },
      { id: 24, tone: 'philosopher', body: '沈黙は、時に最も雄弁な答えになる。' },
      { id: 25, tone: 'philosopher', body: '失敗を恥じる時間で、もう一度、やり直せる。' },

      { id: 27, tone: 'philosopher', body: '自分を救えるのは、結局、自分の手だけ。誰の魔法でもない。' },
      { id: 28, tone: 'philosopher', body: '完璧な誰かより、不器用な本物のあなたの方が、ずっと尊い。' },
      { id: 29, tone: 'philosopher', body: '「今のままじゃダメ」と思ったその瞬間に、もう、変わり始めている。' },
      { id: 30, tone: 'philosopher', body: '真実は、優しくない。でも、嘘よりずっと、あなたを生かす。' },
      { id: 31, tone: 'philosopher', body: '私だって、生地を何度もダメにする。それでも、もう一度、混ぜ始めるの。' },
      { id: 32, tone: 'human', body: '顔にチョコをつけたまま、笑える日が、いちばん尊い。' },

      { id: 34, tone: 'human', body: '不器用な指でも、誰かの心に、温かさは届く。' },
      { id: 35, tone: 'human', body: '一人の夜のお茶は、誰かを思う時間でもある。' },
      { id: 36, tone: 'human', body: '弱さを見せていい場所が、人生に一つあれば、それで十分。' },
      { id: 37, tone: 'human', body: '泣いた跡のあるあなたの顔を、私は美しいと思う。' },
      { id: 38, tone: 'human', body: '立ち止まっていい。立ち止まった人にしか、見えない景色がある。' },
      { id: 39, tone: 'human', body: '急がなくていい。お菓子も、人生も、待つ時間が美味しさを作る。' },
      { id: 40, tone: 'human', body: '「もう、無理」と言える勇気の方が、頑張る勇気より、ずっと難しい。' },
      { id: 41, tone: 'human', body: '一口のケーキが、明日を生きる理由になることがある。それで、十分。' },
      { id: 42, tone: 'mixed', body: '「いつか」じゃない。今日、味わいなさい。' },
      { id: 43, tone: 'mixed', body: '甘さは、逃げ場ではない。立ち直る前の、深呼吸。' },
      { id: 44, tone: 'mixed', body: '手で混ぜる粉の重さの中に、魔法より確かなものがある。' },
      { id: 45, tone: 'mixed', body: 'ケーキの形が崩れても、込めた想いは崩れない。' },
      { id: 46, tone: 'mixed', body: '願いを叶える魔法はもう、ない。でも、願いを抱き続ける力は、ここにある。' },
      { id: 47, tone: 'mixed', body: '焦がした砂糖の苦さも、人生の調味料。捨てなくていい。' },
      { id: 48, tone: 'mixed', body: '完璧なケーキを目指して、不完全に焼けたケーキを愛おしむ。それでいいのよ。' },
      { id: 49, tone: 'mixed', body: 'あなたの夢の重さは、あなただけが知っている。誰にも値踏みさせないで。' },
      { id: 50, tone: 'mixed', body: '扉を開けたなら、もう、戻らなくていい。そのまま、進みなさい。' },
    ];

    /* ===== オープニング演出（v4.1 H-1）: 動画 → ホワイトアウト → フェードイン ===== */
    function OpeningAnimation({ onComplete }) {
      const [stage, setStage] = React.useState('video');
      const [whiteOpacity, setWhiteOpacity] = React.useState(0);
      const videoRef = React.useRef(null);

      useEffect(() => {
        document.body.style.overflow = 'hidden';
        return () => {
          if (!document.querySelector('.letter-overlay')) {
            document.body.style.overflow = '';
          }
        };
      }, []);

      useEffect(() => {
        if (stage !== 'video') return;
        const fallback = setTimeout(() => setStage('whiteout'), 6500);
        return () => clearTimeout(fallback);
      }, [stage]);

      useEffect(() => {
        const video = videoRef.current;
        if (!video || stage !== 'video') return;
        const tryPlay = () => { video.play().catch(() => {}); };
        if (video.readyState >= 2) tryPlay();
        else video.addEventListener('canplay', tryPlay, { once: true });
      }, [stage]);

      useEffect(() => {
        if (stage === 'whiteout') {
          setWhiteOpacity(0);
          const raf = requestAnimationFrame(() => {
            requestAnimationFrame(() => setWhiteOpacity(1));
          });
          const t = setTimeout(() => setStage('fadein'), 800);
          return () => clearTimeout(t);
        }
        if (stage === 'fadein') {
          setWhiteOpacity(0);
          const t = setTimeout(() => {
            setStage('done');
            onComplete();
          }, 1000);
          return () => clearTimeout(t);
        }
      }, [stage, onComplete]);

      if (stage === 'done') return null;

      const whiteTransition = stage === 'fadein'
        ? 'opacity 1s ease'
        : 'opacity 0.8s ease';

      return ReactDOM.createPortal(
        <div
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            width: '100vw',
            height: '100vh',
            height: '100dvh',
            zIndex: 100001,
            background: '#000',
            pointerEvents: 'auto',
          }}
          aria-hidden="true"
        >
          {stage === 'video' && (
            <video
              ref={videoRef}
              className="opening-video"
              src={OPENING_VIDEO}
              autoPlay
              muted
              playsInline
              preload="auto"
              onEnded={() => setStage('whiteout')}
            />
          )}
          {(stage === 'whiteout' || stage === 'fadein') && (
            <div
              style={{
                position: 'absolute',
                inset: 0,
                background: '#FFFFFF',
                opacity: whiteOpacity,
                transition: whiteTransition,
                pointerEvents: 'none',
              }}
            />
          )}
        </div>,
        document.body
      );
    }

    /* ===== 手紙ポップアップ（占いメッセージ） ===== */
    function LetterPopup({ message, onClose }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!message) return null;

      return (
        <div className="letter-overlay" onClick={onClose} role="dialog" aria-modal="true">
          <div className="letter-card" onClick={(e) => e.stopPropagation()}>
            <button
              type="button"
              onClick={onClose}
              style={{
                position: 'absolute', top: 12, right: 14,
                background: 'none', border: 'none', fontSize: '1.4rem',
                cursor: 'pointer', color: '#333', lineHeight: 1,
              }}
              aria-label="閉じる"
            >✕</button>
            <p style={{
              fontFamily: "'Playfair Display', serif",
              fontSize: '0.85rem',
              color: PINK_LOGO_COLOR,
              letterSpacing: '0.2em',
              marginBottom: 16,
            }}>— MAJORIN —</p>
            <p style={{
              fontSize: '1.25rem',
              lineHeight: 1.9,
              color: '#1A1A1A',
              fontStyle: 'italic',
            }}>{message.body}</p>
          </div>
        </div>
      );
    }

    /* ===== パーティクル1粒 ===== */
    function ParticleDot({ angle, distance, size, emoji }) {
      const [gone, setGone] = React.useState(false);
      React.useEffect(() => {
        const id = requestAnimationFrame(() => setGone(true));
        return () => cancelAnimationFrame(id);
      }, []);
      const rad = (angle * Math.PI) / 180;
      const tx = Math.cos(rad) * distance;
      const ty = Math.sin(rad) * distance;
      return (
        <div style={{
          position: 'absolute',
          top: '50%', left: '50%',
          fontSize: size + 'px',
          lineHeight: 1,
          marginLeft: '-0.5em', marginTop: '-0.5em',
          pointerEvents: 'none',
          transform: gone
            ? `translate(${tx}px, ${ty}px) scale(0)`
            : 'translate(0,0) scale(1)',
          opacity: gone ? 0 : 1,
          transition: 'transform 0.75s cubic-bezier(0.15,0.85,0.25,1), opacity 0.75s ease-out',
          zIndex: 30,
        }}>{emoji}</div>
      );
    }

    /* ===== 魔女マスコット（クリック → バブル爆発 → 手紙は画面中央に1箇所表示） ===== */
    function WitchMascot({ src, side, topPx, onOpenLetter }) {
      const [phase, setPhase] = React.useState('idle');
      const [particles, setParticles] = React.useState([]);
      const reviveRef = React.useRef(null);
      const usedIdsRef = React.useRef(new Set());
      const EMOJIS = ['🌸', '🌺', '✦', '✿', '★', '🌟', '✧', '❀'];
      const REVIVE_MS = 30000;

      const pickMessage = () => {
        const pool = MARJORIN_MESSAGES.filter((m) => !usedIdsRef.current.has(m.id));
        const list = pool.length ? pool : MARJORIN_MESSAGES;
        if (pool.length === 0) usedIdsRef.current.clear();
        const msg = list[Math.floor(Math.random() * list.length)];
        usedIdsRef.current.add(msg.id);
        return msg;
      };

      const scheduleRevive = () => {
        clearTimeout(reviveRef.current);
        reviveRef.current = setTimeout(() => {
          setPhase('idle');
        }, REVIVE_MS);
      };

      const handleClick = () => {
        if (phase !== 'idle') return;
        const pts = Array.from({ length: 20 }, (_, i) => ({
          id: i,
          angle: (i / 20) * 360 + (Math.random() * 18 - 9),
          distance: 55 + Math.random() * 95,
          size: 12 + Math.floor(Math.random() * 13),
          emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
        }));
        setParticles(pts);
        setPhase('exploding');
        setTimeout(() => {
          setParticles([]);
          setPhase('hidden');
          onOpenLetter(pickMessage(), scheduleRevive);
        }, 650);
      };

      React.useEffect(() => () => clearTimeout(reviveRef.current), []);

      if (phase === 'hidden') return null;

      return (
        <div
          title="クリックしてみて"
          style={{
            position: 'absolute',
            [side]: '16px',
            top: topPx + 'px',
            zIndex: 5,
          }}
        >
          <div style={{ position: 'relative', width: '140px', height: '140px' }}>
            <div
              onClick={handleClick}
              style={{
                width: '140px',
                height: '140px',
                borderRadius: '50%',
                overflow: 'hidden',
                border: `3px solid ${PINK_LOGO_COLOR}88`,
