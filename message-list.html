<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マジョリンからの言葉 — 全50件</title>
  <meta name="description" content="マジョリンスイーツ「マジョリンからの言葉」メッセージ一覧（全50件）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #C04060;
      --pink-light: #F5E6EB;
      --ink: #1a1a1a;
      --muted: #666;
      --paper: #FAF7F4;
      --border: #E8DDD8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif JP', serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 300;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
      margin-bottom: 40px;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .tone-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tone-dot.devil { background: #8B2942; }
    .tone-dot.philosopher { background: #4A5568; }
    .tone-dot.human { background: #C07850; }
    .tone-dot.mixed { background: var(--pink); }

    .message-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 12px 16px;
      align-items: start;
      transition: box-shadow 0.2s;
    }

    .message-item:hover {
      box-shadow: 0 4px 16px rgba(192, 64, 96, 0.08);
    }

    .message-no {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--pink);
      line-height: 1;
      padding-top: 4px;
    }

    .message-body {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .tone-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.04em;
      align-self: start;
      margin-top: 2px;
    }

    .tone-badge.devil { background: #F3E8EC; color: #8B2942; }
    .tone-badge.philosopher { background: #EDF0F4; color: #4A5568; }
    .tone-badge.human { background: #F5EDE6; color: #9A5C38; }
    .tone-badge.mixed { background: var(--pink-light); color: var(--pink); }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      .message-item {
        grid-template-columns: 36px 1fr;
      }
      .tone-badge {
        grid-column: 2;
        justify-self: start;
      }
    }

    @media print {
      body { background: #fff; }
      .page { padding: 24px; }
      .message-item {
        break-inside: avoid;
        box-shadow: none;
      }
      .message-item:hover { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="brand">Majorin Sweets</p>
      <h1>マジョリンからの言葉</h1>
      <p class="subtitle">占い機能で表示されるメッセージ一覧（mahorin_sweet_0605.html と同期）</p>
      <div class="meta">
        <span>全 50 件</span>
        <span>更新日：2026年6月5日</span>
        <span>参照元：mahorin_sweet_0605.html</span>
      </div>
    </header>

    <div class="legend">
      <div class="legend-item"><span class="tone-dot devil"></span>Devil — 鋭く核心を突く</div>
      <div class="legend-item"><span class="tone-dot philosopher"></span>Philosopher — 人生哲学</div>
      <div class="legend-item"><span class="tone-dot human"></span>Human — 温かく弱さを見せる</div>
      <div class="legend-item"><span class="tone-dot mixed"></span>Mixed — お菓子・夢・選択</div>
    </div>

    <ol class="message-list" id="message-list"></ol>

    <footer>
      <p>© Majorin Sweets — クライアント共有用ドキュメント</p>
    </footer>
  </div>

  <script>
    const TONE_LABELS = {
      devil: 'Devil',
      philosopher: 'Philosopher',
      human: 'Human',
      mixed: 'Mixed',
    };

            const MARJORIN_MESSAGES = [
      { id: 1, tone: 'mixed', body: '完璧な人生などない。でも、その一瞬を輝かせることは、あなたにもできる。' },
      { id: 2, tone: 'mixed', body: '痛みを消すのではなく、痛みと共に歩む力を、そっと渡したい。' },
      { id: 3, tone: 'mixed', body: '夢は遠くにあるのではない。今日の一口の甘さの中にある。' },
      { id: 4, tone: 'mixed', body: '勝者でなくていい。心があるものの方が、ずっと強い。' },
      { id: 5, tone: 'mixed', body: '手で作ったものだけが、心に残る。魔法ではなく、あなたの時間を。' },
      { id: 6, tone: 'mixed', body: '不器用な形のケーキほど、温かいことがある。' },
      { id: 7, tone: 'mixed', body: '真実の一言は、50枚のカードの中に、一枚だけある。' },
      { id: 8, tone: 'mixed', body: 'お菓子は、あなたを癒す魔法。杖は、もう置いた。' },
      { id: 9, tone: 'mixed', body: 'MAJORINS の扉を開けたあなたへ——ようこそ、甘さの世界へ。' },
      { id: 10, tone: 'mixed', body: '輝くパッションを、心に響くスイーツで届けたい。' },
      { id: 11, tone: 'devil', body: '言い訳の数だけ、あなたから自由が遠ざかる。' },
      { id: 12, tone: 'devil', body: '迷っている時点で、答えはもう出ている。それを認める勇気だけが、足りないの。' },
      { id: 13, tone: 'devil', body: '「できない」は、たいてい「やりたくない」の上品な言い換え。' },
      { id: 14, tone: 'devil', body: '完璧を装うのは、もう、おやめなさい。' },
      { id: 15, tone: 'devil', body: '期待された通りに生きて、それで満足? ——本当に?' },
      { id: 16, tone: 'devil', body: '「忙しい」という言葉に、私はもう騙されない。あなたも、騙されないで。' },
      { id: 17, tone: 'devil', body: '強がりは美しくない。素直さの方が、ずっと品がある。' },
      { id: 18, tone: 'devil', body: '諦める理由を、他人に求めないで。' },
      { id: 19, tone: 'devil', body: '自分の気持ちを偽らないで。貴方の本当を生きるのよ！' },
      { id: 20, tone: 'devil', body: 'あなたのベストは、本当にそれ?' },
      { id: 21, tone: 'devil', body: '痛みを抱えたまま、歩いていい。消さなくていい。' },
      { id: 22, tone: 'philosopher', body: '完璧な選択など、どこにもない。選んだ道を、完璧にしていくだけ。' },
      { id: 23, tone: 'philosopher', body: '強さとは、弱さを許すこと。50年生きて、やっとわかった。' },
      { id: 24, tone: 'philosopher', body: '沈黙は、時に最も雄弁な答えになる。' },
      { id: 25, tone: 'philosopher', body: '失敗を恥じる時間で、もう一度、やり直せる。' },
      { id: 26, tone: 'philosopher', body: '過去を消したくなる夜こそ、未来を作る材料になる。' },
      { id: 27, tone: 'philosopher', body: '自分を救うのは結局自分を信じる力。少しだけマジョリンスイーツを取り入れてみて！きっと力が湧いてくるわよ' },
      { id: 28, tone: 'philosopher', body: '完璧な誰かより、不器用な本物のあなたの方が、ずっと尊い。' },
      { id: 29, tone: 'philosopher', body: '「今のままじゃダメ」と思ったその瞬間に、もう、変わり始めている。' },
      { id: 30, tone: 'philosopher', body: '真実は、優しくない。でも、嘘よりずっと、あなたを生かす。' },
      { id: 31, tone: 'philosopher', body: '私だって、生地を何度もダメにする。それでも、もう一度、混ぜ始めるの。' },
      { id: 32, tone: 'human', body: '顔にチョコをつけたまま、笑える日が、いちばん尊い。' },
      { id: 33, tone: 'human', body: '「まぁ、いっか」と呟ける夜が、本当の強さの始まり。' },
      { id: 34, tone: 'human', body: '不器用な指でも、誰かの心に、温かさは届く。' },
      { id: 35, tone: 'human', body: '一人の夜のお茶は、誰かを思う時間でもある。' },
      { id: 36, tone: 'human', body: '弱さを見せていい場所が、人生に一つあれば、それで十分。' },
      { id: 37, tone: 'human', body: '泣いた跡のあるあなたの顔を、私は美しいと思う。' },
      { id: 38, tone: 'human', body: '立ち止まっていい。立ち止まった人にしか、見えない景色がある。' },
      { id: 39, tone: 'human', body: '急がなくていい。お菓子も、人生も、待つ時間が美味しさを作る。' },
      { id: 40, tone: 'human', body: '「もう、無理」と言える勇気の方が、頑張る勇気より、ずっと難しい。' },
      { id: 41, tone: 'human', body: '一口のケーキが、明日を生きる理由になることがある。それで、十分。' },
      { id: 42, tone: 'mixed', body: '「いつか」じゃない。今日、味わいなさい。' },
      { id: 43, tone: 'mixed', body: '甘さは、逃げ場ではない。立ち直る前の、深呼吸。' },
      { id: 44, tone: 'mixed', body: '手で混ぜる粉の重さの中に、魔法より確かなものがある。' },
      { id: 45, tone: 'mixed', body: 'ケーキの形が崩れても、込めた想いは崩れない。' },
      { id: 46, tone: 'mixed', body: '願いを叶える魔法はもう、ない。でも、願いを抱き続ける力は、ここにある。' },
      { id: 47, tone: 'mixed', body: '焦がした砂糖の苦さも、人生の調味料。捨てなくていい。' },
      { id: 48, tone: 'mixed', body: '完璧なケーキを目指して、不完全に焼けたケーキを愛おしむ。それでいいのよ。' },
      { id: 49, tone: 'mixed', body: 'あなたの夢の重さは、あなただけが知っている。誰にも値踏みさせないで。' },
      { id: 50, tone: 'mixed', body: '扉を開けたなら、もう、戻らなくていい。そのまま、進みなさい。' },
    ];

    const list = document.getElementById('message-list');
    MARJORIN_MESSAGES.forEach((msg) => {
      const li = document.createElement('li');
      li.className = 'message-item';
      li.innerHTML = `
        <span class="message-no">${String(msg.id).padStart(2, '0')}</span>
        <p class="message-body">${msg.body}</p>
        <span class="tone-badge ${msg.tone}">${TONE_LABELS[msg.tone]}</span>
      `;
      list.appendChild(li);
    });
  </script>
</body>
</html>
