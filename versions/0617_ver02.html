<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Majorin Sweets - 魔法の扉を開けて</title>
  <meta name="description" content="魔法じゃない、本物の甘さ。扉を開けて、マジョリンの世界へ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="preload" href="0525/0525.mp4" as="video" type="video/mp4">
  <link rel="stylesheet" href="css/transition.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #0a0a0a;
    }
    
    /* ========== ANIMATIONS ========== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes petalFall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    @keyframes butlerAppear {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes choicesFadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes doorGlow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(222, 134, 163, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(222, 134, 163, 0.85));
      }
    }
    
    @keyframes productFadeIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(192, 64, 96, 0.25);
      }
      50% {
        box-shadow: 0 0 60px rgba(192, 64, 96, 0.45);
      }
    }

    /* ===== OPENING（HTML直書き・Reactより先に再生） ===== */
    #majorin-opening {
      position: fixed;
      inset: 0;
      z-index: 100001;
      background: #000;
    }
    #majorin-opening video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #majorin-opening-white {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #majorin-opening-skip {
      position: absolute;
      right: 24px;
      bottom: 28px;
      z-index: 2;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(10, 10, 10, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      padding: 12px 22px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    #majorin-opening-skip:hover {
      background: rgba(10, 10, 10, 0.65);
      border-color: rgba(255, 255, 255, 0.55);
      color: #fff;
    }
    #majorin-opening-skip:focus-visible {
      outline: 2px solid rgba(222, 134, 163, 0.9);
      outline-offset: 2px;
    }

    .hero-caption-body {
      color: #FFFFFF;
      -webkit-text-stroke: 1px #000000;
      paint-order: stroke fill;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ===== LETTER POPUP (占い) ===== */
    @keyframes letterPopIn {
      from { opacity: 0; transform: translateY(20px) scale(0.88); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* 画面中央に固定（Portal で body 直下に描画） */
    .letter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(10, 10, 10, 0.6);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .letter-card {
      animation: letterPopIn 0.45s ease-out both;
      max-width: 420px;
      width: 100%;
      background: linear-gradient(165deg, #faf6f0 0%, #f0e8dc 100%);
      border: 2px solid rgba(26, 26, 26, 0.15);
      border-radius: 4px;
      padding: 40px 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      position: relative;
      font-family: 'Cormorant Garamond', serif;
    }
    .letter-card::before {
      content: '';
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px solid rgba(192, 64, 96, 0.25);
      pointer-events: none;
    }
    .story-chapter-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #1A1A1A;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .story-chapter-divider {
      text-align: center;
      color: #C04060;
      letter-spacing: 0.4em;
      margin: 48px 0 40px;
      font-size: 0.85rem;
    }
    
    .petal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #DE86A3, transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: petalFall 10s linear infinite;
    }
    
    .petal:nth-child(1) { left: 10%; animation-delay: 0s; }
    .petal:nth-child(2) { left: 20%; animation-delay: 2s; }
    .petal:nth-child(3) { left: 30%; animation-delay: 4s; }
    .petal:nth-child(4) { left: 40%; animation-delay: 1s; }
    .petal:nth-child(5) { left: 50%; animation-delay: 3s; }
    .petal:nth-child(6) { left: 60%; animation-delay: 5s; }
    .petal:nth-child(7) { left: 70%; animation-delay: 2.5s; }
    .petal:nth-child(8) { left: 80%; animation-delay: 4.5s; }
    .petal:nth-child(9) { left: 90%; animation-delay: 1.5s; }
    
    @media (max-width: 768px) {
      [data-grid] {
        grid-template-columns: 1fr !important;
      }
      
      .butler-image {
        height: 50vh !important;
        max-height: 400px !important;
      }
      
      .welcome-title {
        font-size: 1.8rem !important;
      }
      
      .choice-button {
        padding: 20px 35px !important;
        font-size: 1rem !important;
      }
    }

    /* MOVIE: 769px 以上は 16:9。768px 以下はインラインの縦長（9:16）のまま */
    @media (min-width: 769px) {
      .movie-video-frame {
        width: min(100%, 920px) !important;
        aspect-ratio: 16 / 9 !important;
        max-height: none !important;
      }
    }

    /* ===== STORY ALTERNATING ROWS ===== */
    .story-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 64px;
      margin-bottom: 88px;
    }
    .story-row.reverse {
      flex-direction: row-reverse;
    }
    .story-row-img {
      width: 46%;
      flex-shrink: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 44px rgba(0,0,0,0.18);
    }
    .story-row-img img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }
    .story-row-text {
      flex: 1;
    }

    /* ===== WITCH MASCOT ===== */
    @keyframes witchFloat {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50%       { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes witchBurst {
      0%   { transform: scale(1)   rotate(0deg);   opacity: 1; }
      20%  { transform: scale(1.3) rotate(30deg);  opacity: 0.9; }
      100% { transform: scale(0)   rotate(720deg); opacity: 0; }
    }

    /* ===== CHOICE BUTTONS: 右から左へスライドイン ===== */
    @keyframes slideInFromRight {
      from { opacity: 0; transform: translateX(140px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .choice-btn-0 { animation: slideInFromRight 0.55s ease-out 0.10s both; }
    .choice-btn-1 { animation: slideInFromRight 0.55s ease-out 0.35s both; }
    .choice-btn-2 { animation: slideInFromRight 0.55s ease-out 0.60s both; }
    .choice-btn-3 { animation: slideInFromRight 0.55s ease-out 0.85s both; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .story-row,
      .story-row.reverse {
        flex-direction: column !important;
        gap: 24px;
        margin-bottom: 56px;
      }
      .story-row-img {
        width: 100%;
      }
      .story-row-img img {
        height: 260px;
      }
    }

    /* ========================================
       MAJORINS Showcase Section
       ======================================== */
    .showcase-section {
      --color-bg: #14080d;
      --color-bg-deep: #0a0407;
      --color-rose: #c47b8a;
      --color-rose-deep: #8a4a5a;
      --color-gold: #d4af6e;
      --color-gold-bright: #f0d090;
      --color-text: #f5e8d8;
      --color-text-muted: #b8a090;
      --font-display: 'Cormorant Garamond', serif;
      --font-body-jp: 'Noto Serif JP', serif;

      position: relative;
      background: radial-gradient(ellipse at center top, #2a1820 0%, var(--color-bg) 40%, var(--color-bg-deep) 100%);
      padding: 100px 20px 40px;
      overflow: visible;
      color: var(--color-text);
      font-family: var(--font-body-jp);
    }

    .showcase-section *,
    .showcase-section *::before,
    .showcase-section *::after {
      box-sizing: border-box;
    }

    .showcase-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 80%, rgba(212, 175, 110, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(196, 123, 138, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .showcase-intro {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 60px;
      position: relative;
      z-index: 2;
    }

    .showcase-intro-eyebrow {
      font-family: var(--font-display);
      font-style: italic;
      color: var(--color-rose);
      letter-spacing: 0.3em;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: showcaseFadeUp 1.2s ease 0.2s forwards;
    }

    .showcase-intro-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--color-gold-bright);
      margin: 0 0 16px;
      opacity: 0;
      animation: showcaseFadeUp 1.2s ease 0.4s forwards;
    }

    .showcase-intro-text {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--color-text-muted);
      font-weight: 300;
      letter-spacing: 0.1em;
      margin: 0;
      opacity: 0;
      animation: showcaseFadeUp 1.2s ease 0.6s forwards;
    }

    @keyframes showcaseFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .showcase-window {
      position: relative;
      max-width: 1400px;
      margin: 0 auto;
      aspect-ratio: 1700 / 850;
      opacity: 0;
      animation: showcaseFadeUp 1.4s ease 0.8s forwards;
    }

    /* ショーケースA: 値札・ホバーカード分の余白を確保 */
    .showcase-window:not(.showcase-window--coming-soon) {
      margin-bottom: 320px;
    }

    .showcase-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .cake-item {
      position: absolute;
      bottom: 18%;
      width: 22%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 3;
    }

    .cake-item[data-position="left"]   { left: 22%; }
    .cake-item[data-position="center"] { left: 50%; }
    .cake-item[data-position="right"]  { left: 78%; }

    .cake-link {
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .cake-image-wrap {
      position: relative;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cake-image {
      width: 100%;
      height: auto;
      display: block;
      /* 実写透過PNG向け: multiply は黒背景AI版向けだったため通常合成に変更 */
      mix-blend-mode: normal;
      filter: brightness(1) contrast(1.05);
      transition: filter 0.5s ease;
    }

    .showcase-window:has(.cake-item:hover) .cake-item:not(:hover):not(.coming-soon) .cake-image {
      filter: brightness(0.4) contrast(0.95) saturate(0.7);
    }

    .cake-item:not(.coming-soon):hover .cake-image-wrap {
      transform: translateY(-8px) scale(1.04);
    }

    .cake-item:not(.coming-soon):hover .cake-image {
      filter: brightness(1.08) contrast(1.08) drop-shadow(0 0 30px rgba(255, 200, 120, 0.5));
    }

    .showcase-window--coming-soon {
      margin-top: 0;
      margin-bottom: 16px;
      filter: grayscale(100%) brightness(0.62) contrast(0.95) saturate(0.35);
    }

    .cake-item.coming-soon {
      cursor: default;
      pointer-events: none;
    }

    .showcase-window--coming-soon .cake-item.coming-soon .cake-image {
      filter: none;
      mix-blend-mode: normal;
    }

    .coming-soon-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .coming-soon-label {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(0.7rem, 1.1vw, 0.95rem);
      letter-spacing: 0.35em;
      color: rgba(245, 232, 216, 0.9);
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(212, 175, 110, 0.45);
      padding: 10px 18px;
      background: rgba(20, 8, 13, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .spotlight-glow {
      position: absolute;
      left: 50%;
      bottom: -15%;
      width: 120%;
      height: 30%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(255, 210, 140, 0.6) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .cake-item:not(.coming-soon):hover .spotlight-glow {
      opacity: 1;
    }

    .cake-plate {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%) translateY(8px);
      width: 90%;
      min-width: 160px;
      background: linear-gradient(135deg, #1a0f12 0%, #2a181e 50%, #1a0f12 100%);
      border: 1px solid var(--color-gold);
      border-radius: 2px;
      padding: 10px 14px;
      text-align: center;
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(212, 175, 110, 0.3);
      z-index: 2;
    }

    .cake-plate::before,
    .cake-plate::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      background: var(--color-gold);
      border-radius: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }
    .cake-plate::before { left: 6px; }
    .cake-plate::after  { right: 6px; }

    .plate-name {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--color-gold-bright);
      letter-spacing: 0.2em;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .plate-tagline {
      font-family: var(--font-body-jp);
      font-size: 0.65rem;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
      line-height: 1.4;
    }

    .hover-card {
      position: absolute;
      left: 50%;
      top: calc(100% + 80px);
      transform: translateX(-50%) translateY(-15px);
      width: 320px;
      max-width: 90vw;
      background: linear-gradient(180deg, rgba(26, 15, 18, 0.95) 0%, rgba(20, 10, 13, 0.98) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 110, 0.4);
      border-radius: 4px;
      padding: 24px 24px 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(212, 175, 110, 0.15),
        inset 0 1px 0 rgba(212, 175, 110, 0.2);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 4;
    }

    .hover-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--color-gold) 50%, transparent 100%);
    }

    .cake-item:not(.coming-soon):hover .hover-card {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .hover-card-name-jp {
      font-family: var(--font-body-jp);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--color-text);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 4px;
    }

    .hover-card-name-en {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.8rem;
      color: var(--color-rose);
      letter-spacing: 0.2em;
      text-align: center;
      margin-bottom: 16px;
    }

    .hover-card-divider {
      width: 30px;
      height: 1px;
      background: var(--color-gold);
      margin: 0 auto 16px;
      opacity: 0.6;
    }

    .hover-card-description {
      font-size: 0.78rem;
      line-height: 1.8;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
      margin: 0 0 18px;
      text-align: center;
    }

    .hover-card-price {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--color-gold-bright);
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
    }

    .hover-card-price-unit {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-left: 6px;
      letter-spacing: 0.1em;
    }

    .hover-card-cta {
      display: block;
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--color-gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 10px 0;
      border-top: 1px solid rgba(212, 175, 110, 0.25);
      transition: color 0.3s ease, letter-spacing 0.3s ease;
    }

    .cake-item:not(.coming-soon):hover .hover-card-cta {
      color: var(--color-gold-bright);
      letter-spacing: 0.35em;
    }

    .mobile-cake-card.coming-soon {
      pointer-events: none;
    }

    .mobile-cake-card.coming-soon .mobile-cake-image {
      mix-blend-mode: normal;
    }

    .mobile-cake-card.coming-soon .mobile-coming-soon-overlay {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 30px;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
    }

    .showcase-mobile-coming-soon {
      display: none;
    }

    .showcase-mobile {
      display: none;
    }

    @media (max-width: 768px) {
      .showcase-section {
        padding: 60px 16px 48px;
      }

      .showcase-window {
        display: none;
        margin-bottom: 0;
      }

      .showcase-mobile-coming-soon {
        display: block;
        max-width: 420px;
        margin: 48px auto 0;
        filter: grayscale(100%) brightness(0.62) contrast(0.95) saturate(0.35);
      }

      .showcase-mobile-coming-soon-frame {
        width: 100%;
        height: auto;
        display: block;
        margin-bottom: 24px;
        opacity: 0.85;
      }

      .showcase-mobile {
        display: block;
        max-width: 420px;
        margin: 0 auto;
      }

      .mobile-cake-card {
        position: relative;
        margin-bottom: 56px;
        background: linear-gradient(180deg, #2a1820 0%, #14080d 100%);
        border: 1px solid rgba(212, 175, 110, 0.3);
        border-radius: 4px;
        padding: 30px 20px 24px;
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(212, 175, 110, 0.2);
        overflow: hidden;
      }

      .mobile-cake-card::before {
        content: 'MAJORINS';
        position: absolute;
        top: 8px;

  <!-- オープニング: React読み込み前に即再生（v4.1 H-1） -->
  <div id="majorin-opening">
    <video
      id="majorin-opening-video"
      src="0525/0525.mp4"
      muted
      autoplay
      playsinline
      webkit-playsinline
      preload="auto"
      disablepictureinpicture
    ></video>
    <div id="majorin-opening-white"></div>
    <button type="button" id="majorin-opening-skip" aria-label="オープニング動画をスキップ">スキップ</button>
  </div>

  <div id="root" style="opacity:0;visibility:hidden"></div>

  <script>
    (function () {
      var WHITE_IN_MS = 800;
      var FADE_MS = 1000;
      var FALLBACK_MS = 42000;
      var shell = document.getElementById('majorin-opening');
      var video = document.getElementById('majorin-opening-video');
      var white = document.getElementById('majorin-opening-white');
      var skipBtn = document.getElementById('majorin-opening-skip');
      var root = document.getElementById('root');
      if (!shell || !video || !root) return;

      var done = false;
      var whiteoutStarted = false;
      var fallbackTimer = null;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      function tryPlay() {
        var p = video.play();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      }

      function finishOpening() {
        if (done) return;
        done = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        if (shell.parentNode) shell.parentNode.removeChild(shell);
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        root.style.visibility = 'visible';
        root.style.opacity = '1';
        root.style.transition = 'opacity 1s ease';
        window.__OPENING_DONE__ = true;
        window.dispatchEvent(new Event('majorin-opening-done'));
      }

      function startWhiteout() {
        if (done || whiteoutStarted) return;
        whiteoutStarted = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        if (skipBtn) skipBtn.style.display = 'none';
        video.pause();
        video.style.visibility = 'hidden';
        white.style.opacity = '0';
        white.style.transition = 'opacity 0.8s ease';
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            white.style.opacity = '1';
          });
        });
        setTimeout(function () {
          white.style.transition = 'opacity 1s ease';
          white.style.opacity = '0';
          setTimeout(finishOpening, FADE_MS);
        }, WHITE_IN_MS);
      }

      function skipOpening() {
        if (done) return;
        finishOpening();
      }

      video.addEventListener('ended', startWhiteout, { once: true });
      video.addEventListener('loadeddata', tryPlay);
      video.addEventListener('canplay', tryPlay);
      fallbackTimer = setTimeout(startWhiteout, FALLBACK_MS);

      if (skipBtn) {
        skipBtn.addEventListener('click', skipOpening);
      }

      tryPlay();
    })();
  </script>

    function ParticleDot({ angle, distance, size, emoji }) {
      const [gone, setGone] = React.useState(false);
      React.useEffect(() => {
        const id = requestAnimationFrame(() => setGone(true));
        return () => cancelAnimationFrame(id);
      }, []);
      const rad = (angle * Math.PI) / 180;
      const tx = Math.cos(rad) * distance;
      const ty = Math.sin(rad) * distance;
      return (
        <div style={{
          position: 'absolute',
          top: '50%', left: '50%',
          fontSize: size + 'px',
          lineHeight: 1,
          marginLeft: '-0.5em', marginTop: '-0.5em',
          pointerEvents: 'none',
          transform: gone
            ? `translate(${tx}px, ${ty}px) scale(0)`
            : 'translate(0,0) scale(1)',
          opacity: gone ? 0 : 1,
          transition: 'transform 0.75s cubic-bezier(0.15,0.85,0.25,1), opacity 0.75s ease-out',

      const [phase, setPhase] = React.useState('idle');
      const [particles, setParticles] = React.useState([]);
      const reviveRef = React.useRef(null);
      const usedIdsRef = React.useRef(new Set());
      const EMOJIS = ['🌸', '🌺', '✦', '✿', '★', '🌟', '✧', '❀'];
      const REVIVE_MS = 30000;

      const pickMessage = () => {
        const pool = MARJORIN_MESSAGES.filter((m) => !usedIdsRef.current.has(m.id));
        const list = pool.length ? pool : MARJORIN_MESSAGES;
        if (pool.length === 0) usedIdsRef.current.clear();
        const msg = list[Math.floor(Math.random() * list.length)];
        usedIdsRef.current.add(msg.id);
        return msg;
      };

      const scheduleRevive = () => {
        clearTimeout(reviveRef.current);
        reviveRef.current = setTimeout(() => {
          setPhase('idle');
        }, REVIVE_MS);
      };

      const handleClick = () => {
        if (phase !== 'idle') return;
        const pts = Array.from({ length: 20 }, (_, i) => ({
          id: i,
          angle: (i / 20) * 360 + (Math.random() * 18 - 9),
          distance: 55 + Math.random() * 95,
          size: 12 + Math.floor(Math.random() * 13),
          emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
        }));
        setParticles(pts);
        setPhase('exploding');
        setTimeout(() => {
          setParticles([]);
          setPhase('hidden');
          onOpenLetter(pickMessage(), scheduleRevive);
        }, 650);
      };

      React.useEffect(() => () => clearTimeout(reviveRef.current), []);

      if (phase === 'hidden') return null;
