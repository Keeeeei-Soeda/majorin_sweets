# デプロイ: cd workers/stock && npx wrangler login && npx wrangler deploy
# 秘密情報: npx wrangler secret put STRIPE_WEBHOOK_SECRET
#           npx wrangler secret put STRIPE_SECRET_KEY
# Stripe Webhook URL: https://<worker-host>/webhook
#   イベント: checkout.session.completed

name = "majorins-stock"
main = "src/index.js"
compatibility_date = "2026-08-30"

[[kv_namespaces]]
binding = "STOCK"
id = "REPLACE_AFTER_KV_CREATE"
preview_id = "REPLACE_AFTER_KV_CREATE"

[vars]
# フロントの STOCK_API_URL に、デプロイ後の https://majorins-stock.<account>.workers.dev/status を入れる
